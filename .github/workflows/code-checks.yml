name: Code checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository privacy boundary (index + history)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            tools/check_git_privacy.sh --history "${{ github.event.pull_request.base.sha }}..HEAD"
          else
            tools/check_git_privacy.sh
          fi

  python:
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository privacy boundary
        run: tools/check_git_privacy.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Run private-data-independent tests
        run: >-
          python -m unittest -v
          tools.test_apple_health_sleep
          tools.test_daily_checkin
          tools.test_create_backup
          tools.test_git_privacy
          tools.test_google_sheets_state
          tools.test_journal_insights
          tools.test_journal_integrity
          tools.test_journal_manager
          tools.test_journal_review_policy
          tools.test_life_assistant_status
          tools.test_phase_actions
          tools.test_phase_review
          tools.test_portability_doctor
          tools.test_product_surfaces
          tools.test_project_governance
          tools.test_verify_backup
          tools.test_weekly_review

  node:
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository privacy boundary
        run: tools/check_git_privacy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/life-console/package-lock.json
      - name: Run reusable Node tests (plan projection + Google Sheets payload tooling)
        run: >-
          node --test
          tools/test_life_plan_records.mjs
          tools/test_google_sheets_payload.mjs
      - name: Install Life Console dependencies
        working-directory: apps/life-console
        run: npm ci
      - name: Check Life Console generated contract, tests, and build
        working-directory: apps/life-console
        run: npm test && npm run build
