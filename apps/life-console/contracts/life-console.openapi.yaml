openapi: 3.1.0
info:
  title: Life Console Local API
  version: 1.0.0
  description: Mac-only localhost contract. Examples are synthetic and contain no real personal data.
servers:
  - url: http://127.0.0.1:47321
security:
  - LocalSession: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Hub is ready without reading personal content.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, schema_version]
                properties:
                  status: {type: string, const: ready}
                  schema_version: {type: integer, const: 1}
  /api/v1/session:
    get:
      operationId: createSession
      security: []
      responses:
        "200":
          description: Same-origin local session. Response must use Cache-Control no-store.
          headers:
            Set-Cookie:
              description: HttpOnly SameSite=Strict local session cookie.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, csrf_token, expires_at]
                properties:
                  schema_version: {type: integer, const: 1}
                  csrf_token: {type: string, minLength: 16, maxLength: 200}
                  expires_at: {type: string, format: date-time}
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Whitelisted local dashboard snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dashboard"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/journals:
    post:
      operationId: createJournal
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JournalRequest"}
      responses:
        "200": {$ref: "#/components/responses/CommandSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/checkins/{date}:
    post:
      operationId: upsertCheckin
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckinRequest"}
      responses:
        "200": {$ref: "#/components/responses/CommandSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/capture/preview:
    post:
      operationId: previewCapture
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, text, context_etag]
              properties:
                schema_version: {type: integer, const: 1}
                text: {type: string, minLength: 1, maxLength: 8000}
                context_etag: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: Preview or safe handoff state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CapturePreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/capture/commit:
    post:
      operationId: commitCapture
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, idempotency_key, preview_token]
              properties:
                schema_version: {type: integer, const: 1}
                idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
                preview_token: {type: string, minLength: 24, maxLength: 500}
      responses:
        "200": {$ref: "#/components/responses/CommandSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/confirmations:
    get:
      operationId: getConfirmations
      responses:
        "200":
          description: Safe confirmation projections without raw content.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema_version, items]
                properties:
                  schema_version: {type: integer, const: 1}
                  items:
                    type: array
                    maxItems: 20
                    items: {$ref: "#/components/schemas/Confirmation"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/purge-plans:
    post:
      operationId: createPurgePlan
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, target_type, target_key]
              properties:
                schema_version: {type: integer, const: 1}
                target_type: {type: string, enum: [journal, daily_checkin, weekly_review, phase_review]}
                target_key: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: Safe deletion scope preview without raw content.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PurgePlan"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/purge-confirmations:
    post:
      operationId: confirmPurge
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, idempotency_key, plan_id, confirmation_text, expect_revision, plan_etag, acknowledge_historical_copies]
              properties:
                schema_version: {type: integer, const: 1}
                idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
                plan_id: {type: string, minLength: 16, maxLength: 200}
                confirmation_text: {type: string, minLength: 1, maxLength: 200}
                expect_revision: {type: integer, minimum: 1}
                plan_etag: {type: string, minLength: 16, maxLength: 200}
                acknowledge_historical_copies: {type: boolean, const: true}
      responses:
        "200": {$ref: "#/components/responses/CommandSuccess"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/journal-enrichments/preview:
    post:
      operationId: previewJournalEnrichment
      description: >-
        Build a per-entry send preview for optional DeepSeek semantic
        enrichment. This never contacts the network; it only binds a short-lived
        token to the current entry snapshot, provider, model, writable-field
        allowlist, prompt version, authorization version, and retry ceiling.
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, journal_id]
              properties:
                schema_version: {type: integer, const: 1}
                journal_id: {type: string, minLength: 1, maxLength: 120}
                model: {$ref: "#/components/schemas/EnrichmentModel"}
      responses:
        "200":
          description: Offline send-scope preview with a short-lived preview token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrichmentPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/journal-enrichments/commit:
    post:
      operationId: commitJournalEnrichment
      description: >-
        Confirm a previously issued preview and create an idempotent local
        background job. Returns 202 immediately; the local saved journal is never
        blocked. Rejects a drifted source with SOURCE_CHANGED before any send.
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, idempotency_key, preview_token]
              properties:
                schema_version: {type: integer, const: 1}
                idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
                preview_token: {type: string, minLength: 24, maxLength: 500}
      responses:
        "202":
          description: Local background job accepted; no external request has been sent yet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrichmentJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/journal-enrichments/{job_id}:
    get:
      operationId: getJournalEnrichment
      description: Fetch a raw-free enrichment job status.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, minLength: 16, maxLength: 200}
      responses:
        "200":
          description: Raw-free job status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrichmentJob"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/journal-enrichments/{job_id}/retry:
    post:
      operationId: retryJournalEnrichment
      description: >-
        User-initiated retry of a failed job. Returns immediately; the worker
        re-validates the source before any send.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, minLength: 16, maxLength: 200}
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, idempotency_key]
              properties:
                schema_version: {type: integer, const: 1}
                idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
      responses:
        "202":
          description: Retry accepted; no external request has been sent yet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrichmentJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/journal-enrichments/enrich:
    post:
      operationId: enrichJournalNow
      description: >-
        One-step enrichment for a journal id: the Hub mints a preview and
        commits it in a single call (used by auto-enrich-on-save and the manual
        "整理" button). Requires an active launch authorization; returns 202.
      parameters:
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, idempotency_key, journal_id]
              properties:
                schema_version: {type: integer, const: 1}
                idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
                journal_id: {type: string, minLength: 1, maxLength: 120}
      responses:
        "202":
          description: Enrichment job accepted; no external request has been sent yet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrichmentJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/journal-enrichments/by-journal/{journal_id}:
    get:
      operationId: getJournalEnrichmentByJournal
      description: Latest raw-free enrichment status for one journal entry.
      parameters:
        - name: journal_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 120}
      responses:
        "200":
          description: Per-journal enrichment status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JournalEnrichmentStatus"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v1/journals/{journal_id}/delete:
    post:
      operationId: deleteJournal
      description: >-
        Delete one journal entry from the current project (withdraw then purge).
        Requires confirm to equal the journal id; the UI gates this behind a
        second confirmation dialog. Does not touch chats, old ZIPs, or iCloud
        device history.
      parameters:
        - name: journal_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 120}
        - {$ref: "#/components/parameters/CsrfHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, idempotency_key, confirm]
              properties:
                schema_version: {type: integer, const: 1}
                idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
                confirm: {type: string, minLength: 1, maxLength: 120}
      responses:
        "200":
          description: The entry was deleted from the current project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JournalDeleteReceipt"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
components:
  securitySchemes:
    LocalSession:
      type: apiKey
      in: cookie
      name: life_console_session
  parameters:
    CsrfHeader:
      name: X-Life-CSRF
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
  schemas:
    IdempotencyKey:
      type: string
      pattern: "^[A-Za-z0-9_-]{16,100}$"
    AnchorState:
      type: [string, "null"]
      enum: [complete, minimum, skipped, null]
    AnchorValue:
      type: string
      enum: [complete, minimum, skipped]
    Rating:
      type: [integer, "null"]
      minimum: 1
      maximum: 5
    RatingValue:
      type: integer
      minimum: 1
      maximum: 5
    Dashboard:
      type: object
      additionalProperties: false
      required: [schema_version, generated_at, date, today, progress, records, system, source_revisions]
      properties:
        schema_version: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        date: {type: string, format: date}
        today:
          type: object
          additionalProperties: false
          required: [focus, suggested_action, anchors, daily_revision, confirmations]
          properties:
            focus:
              type: object
              additionalProperties: false
              required: [title, phase_label]
              properties:
                title: {type: string, maxLength: 160}
                phase_label: {type: string, maxLength: 80}
            suggested_action:
              type: [object, "null"]
              additionalProperties: false
              required: [id, label, writable]
              properties:
                id: {type: string, maxLength: 120}
                label: {type: string, maxLength: 160}
                writable: {type: boolean}
            anchors:
              type: object
              additionalProperties: false
              required: [wake, body_light, life_action, wind_down]
              properties:
                wake: {$ref: "#/components/schemas/AnchorState"}
                body_light: {$ref: "#/components/schemas/AnchorState"}
                life_action: {$ref: "#/components/schemas/AnchorState"}
                wind_down: {$ref: "#/components/schemas/AnchorState"}
            daily_revision: {type: [integer, "null"], minimum: 1}
            confirmations:
              type: array
              maxItems: 10
              items: {$ref: "#/components/schemas/Confirmation"}
        progress:
          type: object
          additionalProperties: false
          required: [ratings, sleep, sample_counts]
          properties:
            ratings:
              type: array
              maxItems: 31
              items:
                type: object
                additionalProperties: false
                required: [date, sleep_quality, energy, mood, life_feeling]
                properties:
                  date: {type: string, format: date}
                  sleep_quality: {$ref: "#/components/schemas/Rating"}
                  energy: {$ref: "#/components/schemas/Rating"}
                  mood: {$ref: "#/components/schemas/Rating"}
                  life_feeling: {$ref: "#/components/schemas/Rating"}
            sleep:
              type: array
              maxItems: 31
              items:
                type: object
                additionalProperties: false
                required: [date, sleep_time, wake_time, out_of_bed_time]
                properties:
                  date: {type: string, format: date}
                  sleep_time: {type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
                  wake_time: {type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
                  out_of_bed_time: {type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
            sample_counts:
              type: object
              additionalProperties: false
              required: [daily, missing]
              properties:
                daily: {type: integer, minimum: 0, maximum: 31}
                missing: {type: integer, minimum: 0, maximum: 31}
        records:
          type: object
          additionalProperties: false
          required: [recent_journals]
          properties:
            recent_journals:
              type: array
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [id, date, title, summary, enrichment_state]
                properties:
                  id: {type: string, minLength: 1, maxLength: 120}
                  date: {type: string, format: date}
                  title: {type: string, maxLength: 100}
                  summary: {type: string, maxLength: 240}
                  enrichment_state: {$ref: "#/components/schemas/EnrichmentState"}
        system:
          type: object
          additionalProperties: false
          required: [hub, icloud, automation, backup, google, mobile]
          properties:
            hub: {type: string, enum: [ready, unavailable]}
            icloud: {type: string, enum: [readable, writable, partial, unavailable]}
            automation: {type: string, enum: [ready, attention, unknown]}
            backup: {type: string, enum: [ready, attention, unknown]}
            google: {type: string, enum: [paused, on_demand]}
            mobile: {type: string, enum: [pending]}
        source_revisions:
          type: object
          additionalProperties: {type: string}
    JournalRequest:
      type: object
      additionalProperties: false
      required: [schema_version, idempotency_key, event_date, text, time_precision]
      properties:
        schema_version: {type: integer, const: 1}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
        event_date: {type: string, format: date}
        event_time: {type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        time_precision: {type: string, enum: [exact, approximate, unknown]}
        text: {type: string, minLength: 1, maxLength: 20000}
        title: {type: string, minLength: 1, maxLength: 120}
        summary: {type: string, minLength: 1, maxLength: 240}
        facts:
          type: array
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 180}
        feelings:
          type: array
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 180}
        people:
          type: array
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 180}
        places:
          type: array
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 180}
        themes:
          type: array
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 180}
        tags:
          type: array
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 180}
    CheckinRequest:
      type: object
      additionalProperties: false
      required: [schema_version, idempotency_key, expect_revision, fields]
      properties:
        schema_version: {type: integer, const: 1}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
        expect_revision: {type: [integer, "null"], minimum: 1}
        fields:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            sleep_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
            wake_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
            out_of_bed_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
            sleep_quality: {$ref: "#/components/schemas/RatingValue"}
            energy: {$ref: "#/components/schemas/RatingValue"}
            mood: {$ref: "#/components/schemas/RatingValue"}
            life_feeling: {$ref: "#/components/schemas/RatingValue"}
            awake_in_bed: {type: string, enum: [yes, no]}
            wake: {$ref: "#/components/schemas/AnchorValue"}
            body_light: {$ref: "#/components/schemas/AnchorValue"}
            life_action: {$ref: "#/components/schemas/AnchorValue"}
            wind_down: {$ref: "#/components/schemas/AnchorValue"}
            note_summary: {type: string, maxLength: 160}
    CapturePreview:
      type: object
      additionalProperties: false
      required: [schema_version, state, message]
      properties:
        schema_version: {type: integer, const: 1}
        state: {type: string, enum: [available, handoff_required, unavailable]}
        message: {type: string, maxLength: 240}
        preview_token: {type: string, minLength: 24, maxLength: 500}
        intent: {type: string, enum: [journal, checkin, mixed, unknown]}
        preview:
          type: object
          additionalProperties: true
    CheckinConflict:
      type: object
      additionalProperties: false
      required: [target_key, current_revision, current, submitted]
      properties:
        target_key: {type: string, format: date}
        current_revision: {type: [integer, "null"], minimum: 1}
        current:
          type: object
          additionalProperties: false
          properties:
            sleep_time: {type: [string, "null"]}
            wake_time: {type: [string, "null"]}
            out_of_bed_time: {type: [string, "null"]}
            sleep_quality: {$ref: "#/components/schemas/Rating"}
            energy: {$ref: "#/components/schemas/Rating"}
            mood: {$ref: "#/components/schemas/Rating"}
            life_feeling: {$ref: "#/components/schemas/Rating"}
            awake_in_bed: {type: [string, "null"], enum: [yes, no, null]}
            wake: {$ref: "#/components/schemas/AnchorState"}
            body_light: {$ref: "#/components/schemas/AnchorState"}
            life_action: {$ref: "#/components/schemas/AnchorState"}
            wind_down: {$ref: "#/components/schemas/AnchorState"}
        submitted:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            sleep_time: {type: string}
            wake_time: {type: string}
            out_of_bed_time: {type: string}
            sleep_quality: {$ref: "#/components/schemas/RatingValue"}
            energy: {$ref: "#/components/schemas/RatingValue"}
            mood: {$ref: "#/components/schemas/RatingValue"}
            life_feeling: {$ref: "#/components/schemas/RatingValue"}
            awake_in_bed: {type: string, enum: [yes, no]}
            wake: {$ref: "#/components/schemas/AnchorValue"}
            body_light: {$ref: "#/components/schemas/AnchorValue"}
            life_action: {$ref: "#/components/schemas/AnchorValue"}
            wind_down: {$ref: "#/components/schemas/AnchorValue"}
    Confirmation:
      type: object
      additionalProperties: false
      required: [id, type, title, message, action_label]
      properties:
        id: {type: string, maxLength: 160}
        type: {type: string, enum: [revision_conflict, health_conflict, purge_plan, goal_change, service_issue]}
        title: {type: string, maxLength: 120}
        message: {type: string, maxLength: 300}
        action_label: {type: string, maxLength: 80}
    PurgePlan:
      type: object
      additionalProperties: false
      required: [schema_version, plan_id, target_type, target_key, expect_revision, plan_etag, scope_summary, confirmation_text, historical_copies_notice]
      properties:
        schema_version: {type: integer, const: 1}
        plan_id: {type: string, minLength: 16, maxLength: 200}
        target_type: {type: string, enum: [journal, daily_checkin, weekly_review, phase_review]}
        target_key: {type: string, minLength: 1, maxLength: 200}
        expect_revision: {type: integer, minimum: 1}
        plan_etag: {type: string, minLength: 16, maxLength: 200}
        scope_summary: {type: string, maxLength: 600}
        confirmation_text: {type: string, minLength: 1, maxLength: 200}
        historical_copies_notice: {type: string, maxLength: 600}
    EnrichmentModel:
      type: string
      enum: [deepseek-v4-flash, deepseek-v4-pro]
    EnrichmentState:
      type: string
      enum: [raw, working, enriched, failed]
    EnrichmentField:
      type: string
      enum: [title, summary, facts, feelings, people, places, themes, tags]
    EnrichmentPreview:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          preview_token,
          expires_at,
          journal_id,
          provider,
          model,
          prompt_version,
          authorization_version,
          max_retries,
          writable_fields,
          disclosures,
        ]
      properties:
        schema_version: {type: integer, const: 1}
        preview_token: {type: string, minLength: 24, maxLength: 500}
        expires_at: {type: string, format: date-time}
        journal_id: {type: string, minLength: 1, maxLength: 120}
        provider: {type: string, const: deepseek}
        model: {$ref: "#/components/schemas/EnrichmentModel"}
        prompt_version: {type: string, minLength: 1, maxLength: 40}
        authorization_version: {type: string, minLength: 1, maxLength: 40}
        max_retries: {type: integer, minimum: 0, maximum: 2}
        writable_fields:
          type: array
          minItems: 1
          maxItems: 8
          items: {$ref: "#/components/schemas/EnrichmentField"}
        disclosures:
          type: array
          minItems: 1
          maxItems: 12
          items: {type: string, minLength: 1, maxLength: 240}
    EnrichmentJob:
      type: object
      additionalProperties: false
      required: [schema_version, job_id, journal_id, provider, model, prompt_version, status, attempts, max_retries]
      properties:
        schema_version: {type: integer, const: 1}
        job_id: {type: string, minLength: 16, maxLength: 200}
        journal_id: {type: string, minLength: 1, maxLength: 120}
        provider: {type: string, const: deepseek}
        model: {$ref: "#/components/schemas/EnrichmentModel"}
        prompt_version: {type: string, minLength: 1, maxLength: 40}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        attempts: {type: integer, minimum: 0, maximum: 3}
        max_retries: {type: integer, minimum: 0, maximum: 2}
        failure_code:
          type: [string, "null"]
          enum: [PROVIDER_UNAVAILABLE, MODEL_OUTPUT_INVALID, SOURCE_CHANGED, null]
        updated_at: {type: string, format: date-time}
    JournalEnrichmentStatus:
      description: Per-journal enrichment status projection; status "none" means no job yet.
      oneOf:
        - type: object
          additionalProperties: false
          required: [schema_version, journal_id, status]
          properties:
            schema_version: {type: integer, const: 1}
            journal_id: {type: string, minLength: 1, maxLength: 120}
            status: {type: string, const: none}
        - $ref: "#/components/schemas/EnrichmentJob"
    JournalDeleteReceipt:
      type: object
      additionalProperties: false
      required: [request_id, command_id, action, journal_id, message]
      properties:
        request_id: {type: string}
        command_id: {type: string}
        action: {type: string, const: deleted}
        journal_id: {type: string, minLength: 1, maxLength: 120}
        message: {type: string}
    CommandReceipt:
      type: object
      additionalProperties: false
      required: [request_id, command_id, action, source, read_model, message]
      properties:
        request_id: {type: string}
        command_id: {type: string}
        action: {type: string, enum: [created, updated, unchanged]}
        source:
          type: object
          additionalProperties: false
          required: [state, revision]
          properties:
            state: {type: string, const: saved}
            revision: {type: [integer, "null"]}
        read_model: {type: string, enum: [current, pending_refresh]}
        message: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, error]
      properties:
        request_id: {type: string}
        conflict: {$ref: "#/components/schemas/CheckinConflict"}
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, REVISION_CONFLICT, SOURCE_INVALID, SOURCE_CHANGED, NOT_FOUND, HUB_UNAVAILABLE, TOOL_TIMEOUT, PREVIEW_EXPIRED]
            message: {type: string, maxLength: 240}
            retryable: {type: boolean}
  responses:
    CommandSuccess:
      description: Source write completed or was idempotently unchanged.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/CommandReceipt"}
    BadRequest:
      description: Request failed schema or policy validation.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: Local session, CSRF token, or same-origin policy failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Conflict:
      description: Revision or source state conflict.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: The requested local resource does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ServiceUnavailable:
      description: Hub or iCloud source is unavailable.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
