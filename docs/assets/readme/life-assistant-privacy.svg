<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="life-privacy-title life-privacy-desc">
  <title id="life-privacy-title">生活助手的隐私边界</title>
  <desc id="life-privacy-desc">GitHub 只保存可复用代码与模板，用户私人记录保留在自己的私有环境中。</desc>
  <defs><marker id="life-privacy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#4f5d75"/></marker></defs>
  <style>.eyebrow{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:.12em;fill:#7a8399}.heading{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4f5d75}</style>
  <rect width="1280" height="430" rx="24" fill="#f5f5f5"/><text class="eyebrow" x="48" y="52">PRIVACY BOUNDARY</text><text class="heading" x="48" y="90">能力可以复用，私人数据不会随代码流动</text>
  <g transform="translate(48 132)"><rect width="466" height="232" rx="16" fill="#ececec" stroke="#bfc0c0"/><circle cx="46" cy="44" r="17" fill="#2d3142"/><path d="M38 44h16M46 36v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text class="label" x="76" y="50">GitHub · 可复用能力层</text><line x1="28" y1="78" x2="438" y2="78" stroke="#bfc0c0"/><text class="body" x="28" y="116">Skills / Prompts / Tools</text><text class="body" x="250" y="116">Tests / Templates</text><text class="body" x="28" y="154">通用产品代码与治理文档</text><text class="body" x="250" y="154">脱敏示例与公开说明</text><rect x="28" y="180" width="180" height="30" rx="15" fill="#f5f5f5" stroke="#bfc0c0"/><text class="eyebrow" x="118" y="200" text-anchor="middle">NO PERSONAL DATA</text>
    <path d="M480 116H638" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#life-privacy-arrow)"/><text class="body" x="558" y="100" text-anchor="middle">代码与模板</text><g transform="translate(532 130)"><path d="M10 18V9a16 16 0 0 1 32 0v9" fill="none" stroke="#eb6c36" stroke-width="2"/><rect x="2" y="18" width="48" height="42" rx="8" fill="#eb6c36"/><circle cx="26" cy="37" r="4" fill="#fff"/><path d="M26 41v8" stroke="#fff" stroke-width="2"/></g>
    <rect x="652" width="532" height="232" rx="16" fill="#f8ece7" stroke="#eb6c36" stroke-width="2"/><text class="label" x="684" y="50">用户自己的私有环境</text><line x1="680" y1="78" x2="1156" y2="78" stroke="#d7b4a5"/><text class="label" x="684" y="118">iCloud</text><text class="body" x="684" y="145">私人上下文 · 长期记忆 · 计划</text><text class="label" x="920" y="118">Owner-scoped 数据库</text><text class="body" x="920" y="145">日记 · 状态 · 目标 · 复盘</text><rect x="684" y="178" width="442" height="32" rx="8" fill="#fff" stroke="#d7b4a5"/><text class="body" x="905" y="199" text-anchor="middle">访问、写入与发布均受用户确认和治理规则约束</text>
  </g><text class="body" x="48" y="400">边界原则：公开仓库不收集、不提交、不回传任何真实个人记录或凭据。</text>
</svg>
