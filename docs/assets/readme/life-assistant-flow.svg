<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="life-flow-title life-flow-desc">
  <title id="life-flow-title">生活助手工作方式</title>
  <desc id="life-flow-desc">日常输入进入按域分工的私人真相源，经 Life Console 整理后形成行动、复盘与自动化。</desc>
  <defs><marker id="life-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#4f5d75"/></marker></defs>
  <style>.eyebrow{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:.12em;fill:#7a8399}.heading{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2d3142}.body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4f5d75}.tiny{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#7a8399}.line{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#life-flow-arrow)}</style>
  <rect width="1280" height="600" rx="24" fill="#f5f5f5"/><text class="eyebrow" x="48" y="52">HOW IT WORKS</text><text class="heading" x="48" y="92">从日常输入，到可执行的生活闭环</text>
  <g transform="translate(48 144)"><text class="eyebrow">01 · 捕捉</text><g transform="translate(0 30)"><rect width="210" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="24" y="38">日记与快速记录</text><rect y="76" width="210" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="24" y="114">每日状态</text><rect y="152" width="210" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="24" y="190">目标与 Todo</text><rect y="228" width="210" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="24" y="266">Apple Health 汇总</text></g>
    <path class="line" d="M224 205H302"/><g transform="translate(316 30)"><text class="eyebrow" y="-30">02 · 沉淀</text><rect width="284" height="290" rx="16" fill="#f8ece7" stroke="#eb6c36" stroke-width="2"/><path d="M32 68v-13a18 18 0 0 1 36 0v13" fill="none" stroke="#eb6c36" stroke-width="2"/><rect x="26" y="68" width="48" height="42" rx="8" fill="#eb6c36"/><text class="label" x="92" y="72">用户私有真相源</text><text class="body" x="92" y="98">数据不进入公开代码仓库</text><line x1="26" y1="134" x2="258" y2="134" stroke="#bfc0c0"/><text class="label" x="26" y="174">iCloud 私人上下文</text><text class="body" x="26" y="200">长期记忆 · 私人计划 · 稳定偏好</text><text class="label" x="26" y="242">Owner-scoped 产品记录</text><text class="body" x="26" y="268">日记 · 状态 · 目标 · 复盘 · 健康汇总</text></g>
    <path class="line" d="M614 205H682"/><g transform="translate(696 72)"><text class="eyebrow" y="-72">03 · 编排</text><rect width="206" height="206" rx="20" fill="#2d3142"/><circle cx="103" cy="60" r="26" fill="#eb6c36"/><path d="M91 61l8 8 17-19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="112" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#fff">Life Console</text><text x="103" y="142" text-anchor="middle" style="font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#ececec">统一入口 · 规则治理</text><text x="103" y="166" text-anchor="middle" style="font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#ececec">人工确认 · 可追溯</text></g>
    <path class="line" d="M916 205H974"/><g transform="translate(988 30)"><text class="eyebrow" y="-30">04 · 反馈</text><rect width="196" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="22" y="38">今日行动</text><rect y="76" width="196" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="22" y="114">每周复盘</text><rect y="152" width="196" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="22" y="190">阶段回顾</text><rect y="228" width="196" height="62" rx="12" fill="#ececec" stroke="#bfc0c0"/><text class="label" x="22" y="266">受控自动化</text></g>
  </g>
  <g transform="translate(48 528)"><line x2="1184" stroke="#bfc0c0"/><text class="tiny" y="32">派生出口</text><text class="body" x="96" y="32">Google Sheets / XLSX 仅按需单向派生，不作为权威数据源</text></g>
</svg>
